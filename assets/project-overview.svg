<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc"><title id="title">PIC16F877A bare-metal exercises</title><desc id="desc">Separate programs on the PICDEM 2 Plus board. GPIO sequencer: TRIS / PORT → four LEDs. Push-button timer: RA4 input → timed RB0 output. External interrupt: RB0 falling edge → press counter. Buzzer generation: Counter condition → RC2 square wave</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536d83"/></marker></defs><rect width="960" height="478" rx="18" fill="#f4f7fb"/><text x="48" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#132b42">PIC16F877A bare-metal exercises</text><text x="48" y="78" font-family="sans-serif" font-size="16" fill="#52677b">Separate programs on the PICDEM 2 Plus board</text><path d="M456 361 L499 361" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">GPIO sequencer</text><text x="70" y="177" font-family="sans-serif" font-size="15" fill="#475f74">TRIS / PORT → four LEDs</text><rect x="504" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Push-button timer</text><text x="526" y="177" font-family="sans-serif" font-size="15" fill="#475f74">RA4 input → timed RB0 output</text><rect x="48" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">External interrupt</text><text x="70" y="365" font-family="sans-serif" font-size="15" fill="#475f74">RB0 falling edge → press counter</text><rect x="504" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Buzzer generation</text><text x="526" y="365" font-family="sans-serif" font-size="15" fill="#475f74">Counter condition → RC2 square wave</text></svg>
